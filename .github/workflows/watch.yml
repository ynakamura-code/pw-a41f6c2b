name: platform-watch

on:
  schedule:
    # GitHub の無料の定期実行は、混むと毎日5時間ほど後回しにされる（予約9:22→実際14:25など）。
    # そこで早朝から予約を並べておき、「日本時間9:30を過ぎた最初の1回」だけが実際の処理をする。
    # それより早い時刻に動いた回は何もせず終わる（下の「実行してよい時間か調べる」）。
    - cron: "5 19 * * *"   # 予約 04:05（日本時間）
    - cron: "45 19 * * *"   # 予約 04:45（日本時間）
    - cron: "25 20 * * *"   # 予約 05:25（日本時間）
    - cron: "5 21 * * *"   # 予約 06:05（日本時間）
    - cron: "45 21 * * *"   # 予約 06:45（日本時間）
    - cron: "25 22 * * *"   # 予約 07:25（日本時間）
    - cron: "5 23 * * *"   # 予約 08:05（日本時間）
    - cron: "45 23 * * *"   # 予約 08:45（日本時間）
    - cron: "25 0 * * *"   # 予約 09:25（日本時間）
    - cron: "5 1 * * *"   # 予約 10:05（日本時間）
    - cron: "45 1 * * *"   # 予約 10:45（日本時間）
    - cron: "25 2 * * *"   # 予約 11:25（日本時間）
  workflow_dispatch:        # 手動でも実行できる

permissions:
  contents: write

concurrency:
  group: platform-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 前回撮った画面写真を引き継ぐ（比較用）
      - uses: actions/cache@v4
        with:
          path: data
          key: pw-shots-${{ github.run_id }}
          restore-keys: pw-shots-

      - name: 実行してよい時間か調べる
        id: guard
        run: |
          today=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          now=$(TZ=Asia/Tokyo date +%H%M)
          last=$(cat data/last_run 2>/dev/null || echo "")
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "手動実行のため、そのまま実行します"
            echo "skip=no" >> "$GITHUB_OUTPUT"
          elif [ "$last" = "$today" ]; then
            echo "本日（$today）は実行済みのため、今回は何もしません"
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          elif [ "$((10#$now))" -lt 930 ]; then
            echo "まだ日本時間 $now です。9:30 を過ぎるまで実行しません"
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          else
            echo "日本時間 $now、本日はまだ未実行のため実行します"
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Chrome を用意する
        if: steps.guard.outputs.skip != 'yes'
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "PW_CHROME=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium-browser
            echo "PW_CHROME=$(command -v chromium-browser || command -v chromium)" >> "$GITHUB_ENV"
          fi

      - name: チェックを実行する
        if: steps.guard.outputs.skip != 'yes'
        env:
          PW_SLACK_WEBHOOK: ${{ secrets.PW_SLACK_WEBHOOK }}
          PW_NOPUSH: "1"
        run: python3 watch.py

      - name: 結果を公開ページに反映する
        if: steps.guard.outputs.skip != 'yes'
        run: |
          TZ=Asia/Tokyo date +%Y-%m-%d > data/last_run
          git config user.name platform-watch
          git config user.email y.nakamura@busoken.com
          git add -A
          if git diff --cached --quiet; then
            echo "変わりがないため更新しませんでした"
          else
            git commit -qm "$(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi
